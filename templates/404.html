{% extends "base.html" %}
{% load static %}
{% block content %}
    <!--CSS-->
    <link rel="stylesheet" href="{% static "404.css" %}">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="error-card text-center p-4 p-md-5">
            
            <!-- 404 Illustration -->
            <div class="error-illustration mb-4">
                <span class="error-digit">4</span>
                <div class="error-icon-wrapper">
                    <svg class="error-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                </div>
                <span class="error-digit">4</span>
            </div>

            <!-- Error Messages -->
            <h1 class="error-title mb-3">صفحه مورد نظر پیدا نشد!</h1>
            <p class="error-description mb-4">
                متأسفانه صفحه‌ای که به دنبال آن بودید وجود ندارد، حذف شده یا آدرس آن تغییر کرده است.
            </p>

            <!-- Navigation Buttons -->
            <div class="error-actions d-flex justify-content-center gap-3 flex-wrap">
                <a href="/" class="btn-primary-custom">
                    بازگشت به صفحه اصلی
                </a>
                <a href="javascript:history.back()" class="btn-secondary-custom">
                    صفحه قبلی
                </a>
            </div>

        </div>
    </div>

{% endblock %}
