<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ من | پروفایل کاربری</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="static/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="logo">لوگووبلاگ</a>
            <div class="nav-links">
                <a href="home.html">خانه</a>
                <a href="blog.html">مقالات</a>
                <a href="about.html">درباره من</a>
                <a href="contact.html">تماس با من</a>
                <a href="profile.html" class="btn btn-sm">حساب کاربری</a>
            </div>
        </div>
    </nav>

    <main class="main-content container">
        <div class="profile-layout">
            
            <aside class="profile-sidebar">
                <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=400&h=400&fit=crop" alt="آواتار کاربر" class="profile-avatar">
                <h3 class="profile-name">علی رضایی</h3>
                <p class="profile-email">ali.rezaei@example.com</p>
                
                <ul class="profile-menu">
                    <li><a href="#" class="active">تنظیمات حساب</a></li>
                    <li><a href="#">مقالات ذخیره شده</a></li>
                    <li><a href="#">نظرات من</a></li>
                    <li><a href="#" class="text-danger">خروج از حساب</a></li>
                </ul>
            </aside>

            <section class="profile-content">
                <h2>ویرایش اطلاعات کاربری</h2>
                
                <form action="#" method="POST">
                    <div class="form-row">
                        <div class="form-group">
                            <label>نام</label>
                            <input type="text" class="form-control" value="علی">
                        </div>
                        <div class="form-group">
                            <label>نام خانوادگی</label>
                            <input type="text" class="form-control" value="رضایی">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ایمیل</label>
                        <input type="email" class="form-control" value="ali.rezaei@example.com" disabled style="background-color: #f3f4f6; color: #9ca3af;">
                        <span class="form-text">ایمیل قابل تغییر نمی‌باشد.</span>
                    </div>

                    <div class="form-group">
                        <label>درباره من (بیوگرافی)</label>
                        <textarea rows="4" class="form-control" placeholder="کمی درباره خودتان بنویسید...">علاقه‌مند به یادگیری برنامه‌نویسی و پایتون.</textarea>
                    </div>

                    <button type="submit" class="btn">ذخیره تغییرات</button>
                </form>
            </section>

        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2024 تمامی حقوق برای این وبلاگ محفوظ است. طراحی با ❤️</p>
        </div>
    </footer>

</body>
</html>
