<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وبلاگ من | ثبت‌نام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
    <link rel="stylesheet" href="statics/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="logo">لوگووبلاگ</a>
            <div class="nav-links">
                <a href="home.html">خانه</a>
                <a href="blog.html">مقالات</a>
                <a href="about.html">درباره من</a>
                <a href="contact.html">تماس با من</a>
                <a href="login.html" class="btn btn-sm">ورود / ثبت‌نام</a>
            </div>
        </div>
    </nav>

    <main class="main-content container">
        <div class="auth-wrapper">
            <div class="auth-card">
                <h1>ثبت‌نام در وبلاگ</h1>
                <p class="subtitle">به جمع ما بپیوندید و مقالات خود را ذخیره کنید.</p>
                
                <form action="#" method="POST">
                    <div class="form-group">
                        <label>نام و نام خانوادگی</label>
                        <input type="text" class="form-control" placeholder="مثال: علی رضایی" required>
                    </div>

                    <div class="form-group">
                        <label>ایمیل</label>
                        <input type="email" class="form-control" placeholder="example@mail.com" required>
                    </div>

                    <div class="form-group">
                        <label>رمز عبور</label>
                        <input type="password" class="form-control" placeholder="حداقل ۸ کاراکتر" required>
                    </div>

                    <button type="submit" class="btn">ایجاد حساب کاربری</button>
                </form>

                <div class="auth-links">
                    قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2024 تمامی حقوق برای این وبلاگ محفوظ است. طراحی با ❤️</p>
        </div>
    </footer>

</body>
</html>
