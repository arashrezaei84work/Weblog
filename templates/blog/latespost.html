{% load static %}
{% load blog_tags %}
                <div class="widget">
                    <h3 class="widget-title">آخرین مقالات</h3>
                    <ul class="category-list">
                        {% for post in posts %}
                            <li><a href="{% url "blog:single" post.slug %}" style="font-size: 0.9rem;">{{post.title}}</a></li>
                        {% endfor %}
                    </ul>
                </div>
