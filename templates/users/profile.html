{% extends "base.html" %}
{% load static %}
{% block content %}
    <main class="main-content container">
        <div class="profile-layout">
            
            <aside class="profile-sidebar">
                <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?w=400&h=400&fit=crop" alt="آواتار کاربر" class="profile-avatar">
                <h3 class="profile-name">{{request.user.get_full_name}}</h3>
                <p class="profile-email">{{request.user.email}}</p>
                
                <ul class="profile-menu">
                    <li><a href="#" class="active">تنظیمات حساب</a></li>
                    <li><a href="{% url "users:my_posts" %}">پست های من</a></li>
                    <li><a href="{% url "users:my_comments" %}">نظرات من</a></li>
                    <li><a href="{% url "users:logout" %}" class="text-danger">خروج از حساب</a></li>
                </ul>
            </aside>

            <section class="profile-content">
                <h2>ویرایش اطلاعات کاربری</h2>
                
                <form action="#" method="POST">
                    <div class="form-row">
                        <div class="form-group">
                            <label>نام</label>
                            <input type="text" class="form-control" value="{{request.user.first_name}}">
                        </div>
                        <div class="form-group">
                            <label>نام خانوادگی</label>
                            <input type="text" class="form-control" value="{{request.user.last_name}}">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>ایمیل</label>
                        <input type="email" class="form-control" value="{{request.user.email}}" disabled style="background-color: #f3f4f6; color: #9ca3af;">
                        <span class="form-text">ایمیل قابل تغییر نمی‌باشد.</span>
                    </div>

                    <div class="form-group">
                        <label>درباره من (بیوگرافی)</label>
                        <textarea rows="4" class="form-control" placeholder="کمی درباره خودتان بنویسید...">علاقه‌مند به یادگیری برنامه‌نویسی و پایتون.</textarea>
                    </div>

                    <button type="submit" class="btn">ذخیره تغییرات</button>
                </form>
            </section>

        </div>
    </main>

{% endblock %}
