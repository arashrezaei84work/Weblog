{% extends "base.html" %}
{% load static %}
{% block content %}
    <main class="main-content container">
        <div class="contact-layout">
            
            <div class="contact-sidebar">
                <h2>راه‌های ارتباطی</h2>
                <p>برای همکاری، مشاوره یا طرح سوالات خود می‌توانید از طریق فرم و یا راه‌های زیر با من در ارتباط باشید.</p>
                
                <div class="contact-item">📧 ایمیل: info@myblog.com</div>
                <div class="contact-item">📞 تلفن: ۰۹۱۲۳۴۵۶۷۸۹</div>
                <div class="contact-item">📍 آدرس: تهران، خیابان توسعه‌دهندگان</div>
            </div>

            <div class="contact-form-area">
                <h2 style="margin-bottom: 25px; font-size: 1.8rem;">ارسال پیام</h2>
                <form action="#" method="POST">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>نام و نام خانوادگی</label>
                            <input type="text" class="form-control" placeholder="مثال: علی رضایی">
                        </div>
                        <div class="form-group">
                            <label>ایمیل</label>
                            <input type="email" class="form-control" placeholder="example@mail.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>موضوع</label>
                        <input type="text" class="form-control" placeholder="موضوع پیام شما">
                    </div>

                    <div class="form-group">
                        <label>متن پیام</label>
                        <textarea rows="5" class="form-control" placeholder="پیام خود را اینجا بنویسید..."></textarea>
                    </div>

                    <button type="submit" class="btn">ارسال پیام</button>
                </form>
            </div>

        </div>
    </main>

{% endblock  %}
